<div class="scene" id="scene">
  <div class="deco px-heart" style="top:90px;left:160px;width:90px;height:78px;background:#C7B6F2;animation:float 3s ease-in-out infinite"></div>
  <div class="deco px-spark" style="top:160px;right:200px;width:60px;height:60px;background:#F6D98F;animation:pulse 2.4s ease-in-out infinite"></div>
  <div class="deco px-spark" style="bottom:220px;left:260px;width:44px;height:44px;background:#8B72D8;animation:pulse 3s ease-in-out infinite"></div>
  <div class="deco px-heart" style="bottom:260px;right:280px;width:76px;height:66px;background:#8B72D8;animation:float 4s ease-in-out infinite"></div>
  <div class="stack">
    <img id="logo" alt="logo">
    <h1 id="title"></h1>
    <div class="tagline"><span id="tagline"></span><span class="dot">.</span><span class="dot d2">.</span><span class="dot d3">.</span></div>
    <div class="cards">
      <div class="card"><div class="px-heart icon" style="background:#8B72D8"></div><div><div class="klabel">latest sub</div><div class="kname" id="latest-sub">&mdash;</div></div></div>
      <div class="card"><div class="px-heart icon" style="background:#C7B6F2;animation-duration:2.6s"></div><div><div class="klabel">latest follower</div><div class="kname" id="latest-follower">&mdash;</div></div></div>
    </div>
  </div>
</div>
